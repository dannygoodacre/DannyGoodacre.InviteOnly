name: Publish NuGet Package

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version for all packages (e.g. 0.15.0 or 0.15.0-beta.1)'
                required: true
                type: string

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: write

        env:
            VERSION: ${{ inputs.version }}

        steps:
            - name: Validate version
              run: |
                if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                  echo "::error::'$VERSION' is not a valid version. Use MAJOR.MINOR.PATCH with an optional -prerelease suffix."
                  exit 1
                fi

            - uses: actions/checkout@v6

            - name: Check tag does not exist
              run: |
                if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
                  echo "::error::Tag v$VERSION already exists. Choose a new version."
                  exit 1
                fi

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                dotnet-version: '10.0.x'

            - name: Test
              run: dotnet test --configuration Release

            - name: Pack
              run: |
                dotnet pack src/DannyGoodacre.InviteOnly/DannyGoodacre.InviteOnly.csproj \
                --configuration Release \
                -p:Version="$VERSION" \
                --output ${{ github.workspace }}/nupkg

            - name: Push to GitHub Packages
              run: |
                dotnet nuget push ./nupkg/*.nupkg \
                --api-key ${{ secrets.GITHUB_TOKEN }} \
                --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

            - name: Create GitHub release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GH_REPO: ${{ github.repository }}
              run: |
                PRERELEASE_FLAG=""
                if [[ "$VERSION" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
                gh release create "v$VERSION" ./nupkg/*.nupkg \
                  --target "$GITHUB_SHA" \
                  --title "v$VERSION" \
                  --generate-notes \
                  $PRERELEASE_FLAG
